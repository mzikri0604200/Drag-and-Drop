<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AQWS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous" />
    <style>
      body {
        background-color: #2c6b56;
        background-image: url('./test.svg'), url('./wave-haikei.svg');
        background-repeat: no-repeat, no-repeat;
        background-position: center, '';
        background-size: cover, cover;
      }

      .glass {
        background: rgba(255, 255, 255, 0.2);
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 2px solid rgba(255, 255, 255, 0.3);
      }
    </style>
  </head>
  <body class="position-relative">
    <img class="img-fluid position-absolute top-0 end-0" src="pattern.png" />
    <img class="img-fluid position-absolute top-0 start-0" src="pattern1.png" />
    <img class="img-fluid position-absolute bottom-0 start-0" style="transform: rotate(180deg)" src="pattern.png" />
    <img class="img-fluid position-absolute bottom-0 end-0" style="transform: rotate(180deg)" src="pattern1.png" />
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-7">
          <div class="card glass shadow">
            <div class="card-body">
              <img class="w-100 rounded-3" src="aq01.jpg" />
              <img class="w-100 rounded-3" src="aq02.jpg" />
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
