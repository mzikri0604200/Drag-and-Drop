    <style>
      .map-marker-centered {
        background-image: url('https://img.icons8.com/color/48/000000/marker--v1.png') no-repeat;
        width: 50px;
        height: 60px;
        position: absolute;
        z-index: 20;
        left: calc(50% - 25px);
        top: calc(50% - 60px);
        transition: all 0.4s ease;
      }
    </style>

  <body>
    <div id="map" style="height: 350px; width: 850px"></div>
    <p id="address0"></p>
    <p id="address"></p>
    <p id="address2"></p>
    <text-area id="lat"></text-area>
    <text-area id="lng"></text-area>
    <script>
      const apiKey = 'AAPK773bb6e8a03d455aad7f7ce6ad243086dVJJ5KYglU5jIPQHZ7RnkVyOEFY5KBVGG2L-gG0UOkvpoevwRx9IGnc2z4i1r-1y';
      let geocodeService = L.esri.Geocoding.geocodeService();
      const iconMarker = L.icon({
        iconUrl: 'https://indihome.co.id/images/mytsel/lp/marker.svg',
        // iconUrl: 'https://img.icons8.com/color/48/000000/marker--v1.png',
        iconSize: [50, 50],
        className: 'cctvicn',
      });
      let map = L.map('map').setView([-6.175392, 106.827153], 13);
      let marker = L.marker([-6.175392, 106.827153], {
        // draggable: true,
        icon: iconMarker,
      });

      L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
        maxZoom: 18,
        id: 'mapbox/streets-v11',
        accessToken: 'your.mapbox.access.token',
        subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
      }).addTo(map);

      function getAddress(lat, lon) {
        fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`)
          .then((response) => response.json())
          .then((data) => {
            // Menampilkan alamat pada elemen dengan id 'address'
            console.log(data);
            document.getElementById('address2').textContent = data.display_name;
          })
          .catch((error) => {
            console.error('Error:', error);
          });
      }

      function addToTextBox(lt, ln) {
        document.getElementById('lat').innerHTML = lt;
        document.getElementById('lng').innerHTML = ln;
      }

      map.on('move', function (e) {
        // marker.setLatLng(map.getCenter());
        console.log('move');

        let center = map.getCenter();
        marker.setLatLng(center);

        // let lat = center.lat;
        // let lon = center.lng;
        // console.log(lat, lon);
        // getAddress(lat, lon);
      });

      map.on('moveend', function (e) {
        // marker.setLatLng(map.getCenter());
        console.log('moveend');
        let center = map.getCenter();
        let obj = marker.setLatLng(center);
        let lat = center.lat;
        let lon = center.lng;

        // L.esri.Geocoding.reverseGeocode({
        //   apikey: apiKey,
        // })
        //   .latlng([lat, lon])
        //   .run(function (error, result) {
        //     if (error) {
        //       return;
        //     }

        //     // L.marker(result.latlng).addTo(map).bindPopup(result.address.Match_addr).openPopup();
        //     console.log(result.address);
        //     document.getElementById('address').textContent = result.address.Match_addr;
        //   });

        geocodeService
          .reverse()
          .latlng([lat, lon])
          .run(function (error, result) {
            if (error) {
              return;
              console.log('error');
            }

            // L.marker(result.latlng).addTo(map).bindPopup(result.address.Match_addr).openPopup();
            console.log(result.address);
            document.getElementById('address0').textContent = result.address.Match_addr;
          });

        // console.log(lat, lon);
        // console.log(obj);
        getAddress(lat, lon);
      });

      // const search = new GeoSearch.GeoSearchControl({
      //   provider: new GeoSearch.OpenStreetMapProvider(),
      //   style: 'bar',
      // });

      const searchControl = new GeoSearch.GeoSearchControl({
        notFoundMessage: 'Sorry, that address could not be found.',
        style: 'bar',
        autoCompleteDelay: 0,
        provider: new GeoSearch.OpenStreetMapProvider(),
        showMarker: false,
        autoClose: true,
        // marker: marker, // use custom marker, not working?
      });

      map.on('geosearch/showlocation', function (e) {
        console.log(e.location.label);
        // console.log();
        document.getElementById('address').textContent = e.location.label;
      });
      // $('.leaflet-geosearch-bar form');
      // const form = document.querySelector('');
      // const input = form.querySelector('input[type="text"]');

      map.addControl(searchControl);

      // adds listener for drag end event
      // marker.on('dragend', function (event) {
      //   // let marker = event.target;
      //   // let location = marker.getLatLng();
      //   // let lat = location.lat;

      //   // addToTextBox(lat, lon);

      //   console.log(position);
      //   console.log(lat, lng);
      //   console.log('dragend');
      //   // map.setLatLng(lat, lng);
      // });

      marker.addTo(map);
    </script>
