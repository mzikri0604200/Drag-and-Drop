<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mixed observer and horizontal scrolling.</title>
    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" /> -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        overflow-x: hidden;
      }

      .wrapper {
        position: relative;
        width: 100vw;
        padding: 24px;
        padding-bottom: calc(20vh - 24px);
      }

      .section {
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        width: calc(100vw - 48px);
        margin: 0 auto;
        height: 80vh;
        border-radius: 24px;
        font-size: 60px;
        background-color: teal;
        color: white;
      }

      #section1 {
        background-color: teal;
        z-index: 0;
      }

      #section2 {
        background-color: gold;
        z-index: 1;
      }
      #section3 {
        background-color: tomato;
        z-index: 2;
      }
      #section4 {
        background-color: aquamarine;
        z-index: 3;
      }
      #section5 {
        background-color: cornflowerblue;
        z-index: 4;
      }
      #section6 {
        background-color: forestgreen;
        z-index: 5;
      }
      .fixed {
        position: fixed;
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <div>
        <section id="section1" class="section fixed">Section 1</section>
      </div>
      <section id="section2" class="section layer">Section 2</section>
      <section id="section3" class="section layer">Section 3</section>
      <section id="section4" class="section layer">Section 4</section>
      <section id="section5" class="section layer">Section 5</section>
      <section id="section6" class="section layer">Section 6</section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://unpkg.co/gsap@3/dist/gsap.min.js"></script>
    <script src="https://unpkg.com/gsap@3/dist/ScrollTrigger.min.js"></script>
    <script>
      const section1Ref = document.getElementById('section1');
      const layerRefs = document.querySelectorAll('.layer');

      const etalonTop = section1Ref.getBoundingClientRect().top;
      const etalonBottom = section1Ref.getBoundingClientRect().bottom;
      const etalonHeight = section1Ref.offsetHeight;
      const etalonDistance = etalonTop + etalonHeight;

      let currentIndex = 0;
      let currentRef = layerRefs[currentIndex];
      currentRef.style.marginTop = etalonHeight + 'px';

      let currentPos = window.scrollY;

      function toggleStickyBehavior() {
        let scrollPosition = window.scrollY;

        let isScrollUp = currentPos > scrollPosition;

        function getDownDistance() {
          return etalonBottom * (currentIndex + 1) - etalonTop * (currentIndex + 1) + etalonTop;
        }

        function getUpDistance() {
          return etalonBottom * currentIndex + etalonTop * (currentIndex + 1) - etalonTop;
        }

        if (!isScrollUp && scrollPosition >= getDownDistance()) {
          currentRef.style.marginTop = 0;

          if (!currentRef.classList.contains('fixed') && currentIndex < 4) {
            currentRef.classList.add('fixed');

            currentIndex += 1;
            currentRef = layerRefs[currentIndex];
          }
          currentRef.style.marginTop = getDownDistance() + 'px';
        }

        if (isScrollUp && getUpDistance() > scrollPosition && currentIndex > 0) {
          currentRef.style.marginTop = 0;
          currentIndex -= 1;
          currentRef = layerRefs[currentIndex];
          if (currentRef.classList.contains('fixed')) {
            currentRef.classList.remove('fixed');
          }

          if (currentIndex < 1) {
            currentRef.style.marginTop = getUpDistance() + etalonBottom - etalonTop + 'px';
          } else {
            currentRef.style.marginTop = getUpDistance() + etalonBottom + 'px';
          }
        }

        currentPos = window.scrollY;
      }

      window.addEventListener('scroll', toggleStickyBehavior);
      toggleStickyBehavior();
    </script>
  </body>
</html>
