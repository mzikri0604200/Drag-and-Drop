<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mixed observer and horizontal scrolling.</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html {
        display: block;
        height: auto;
        min-height: 100%;
        width: 100%;
      }

      body {
        display: block;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background-color: #171717;
        scroll-behavior: smooth;
      }

      section {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 10px;
      }
      section .img {
        position: relative;
        width: 100%;
        padding: 1vw;
        background: green;
      }
      section .img .img-container {
        width: 100%;
        height: 100%;
        /* padding-top: 80%; */
        padding-top: 40%;
        position: relative;
        overflow: hidden;
        background: red;
      }
      section .img .img-container img {
        width: 100%;
        /* height: 100%; */
        object-fit: cover;
        object-position: center;
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        right: 0;
        /* left: 50%; */
        /* transform: translateX(-50%) scale(1.4); */
        /* transform-origin: 100%; */
      }
    </style>
  </head>
  <body>
    <section>
      <div class="img">
        <div class="img-container">
          <img src="https://picsum.photos/1600/1000?r=1" />
        </div>
      </div>
    </section>
    <section>
      <div class="img">
        <div class="img-container">
          <img src="https://picsum.photos/1600/1000?r=2" />
        </div>
      </div>
    </section>
    <section>
      <div class="img">
        <div class="img-container">
          <img src="https://picsum.photos/1600/1000?r=3" />
        </div>
      </div>
    </section>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://unpkg.co/gsap@3/dist/gsap.min.js"></script>
    <script src="https://unpkg.com/gsap@3/dist/ScrollTrigger.min.js"></script>
    <script>
      gsap.registerPlugin(ScrollTrigger);

      gsap.utils.toArray('.img-container').forEach((container) => {
        const img = container.querySelector('img');
        console.log(container);

        const tl = gsap.timeline({
          scrollTrigger: {
            trigger: container,
            scrub: true,
            pin: false,
          },
        });

        tl.fromTo(
          img,
          {
            yPercent: -50,
            ease: 'none',
          },
          {
            yPercent: 10,
            ease: 'none',
          }
        );
      });
    </script>
  </body>
</html>
